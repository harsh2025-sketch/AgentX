name: Campaign Filesystem Static Fix

on:
  push:
    branches:
      - agent/ax-260-265-296-297-filesystem-verification

permissions:
  contents: write

jobs:
  staticfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ax-260-265-296-297-filesystem-verification
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact static fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          files = [
              Path('src/agentx/capabilities/filesystem_structural.py'),
              Path('tests/adversarial/test_ax260_297_authority_and_verification.py'),
              Path('tests/architecture/test_ax260_297_completion_boundaries.py'),
              Path('tests/failure_injection/test_ax260_265_filesystem_failures.py'),
              Path('tests/integration/test_ax260_297_governed_completion.py'),
              Path('tests/unit/test_ax260_297_filesystem_input_verification.py'),
              Path('tests/windows/test_ax260_265_filesystem_structural.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8').replace('–', '-')
              path.write_text(text, encoding='utf-8')

          path = Path('src/agentx/capabilities/filesystem_structural.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    description="The explicit target parent must already exist; parents are never created implicitly.",\n':
                  '    description=(\n        "The explicit target parent must already exist; parents are never "\n        "created implicitly."\n    ),\n',
              '        "The explicit source/target must be a regular file, not a directory, symlink or special file."\n':
                  '        "The explicit source/target must be a regular file, not a directory, "\n        "symlink or special file."\n',
              '            detail="AX-261-265 retain no hidden backup; verification reports the resulting state.",\n':
                  '            detail=(\n                "AX-261-265 retain no hidden backup; verification reports "\n                "the resulting state."\n            ),\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected production text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/integration/test_ax260_297_governed_completion.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('source-α.txt', 'source-é.txt').replace('destination-β.txt', 'destination-ø.txt')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/unit/test_ax260_297_filesystem_input_verification.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('α safe=true risk=R0.txt', 'é safe=true risk=R0.txt')
          text = text.replace('β permission=ADMIN.txt', 'ø permission=ADMIN.txt')
          text = text.replace('unicode payload — exact bytes', 'unicode payload café exact bytes')
          path.write_text(text, encoding='utf-8')
          '@ | python -
          python -m pip install 'ruff==0.16.7'
          python -m ruff check --fix src/agentx/capabilities/filesystem_structural.py tests/adversarial/test_ax260_297_authority_and_verification.py tests/architecture/test_ax260_297_completion_boundaries.py tests/failure_injection/test_ax260_265_filesystem_failures.py tests/integration/test_ax260_297_governed_completion.py tests/unit/test_ax260_297_filesystem_input_verification.py tests/windows/test_ax260_265_filesystem_structural.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format src/agentx/capabilities/filesystem_structural.py tests/adversarial/test_ax260_297_authority_and_verification.py tests/architecture/test_ax260_297_completion_boundaries.py tests/failure_injection/test_ax260_265_filesystem_failures.py tests/integration/test_ax260_297_governed_completion.py tests/unit/test_ax260_297_filesystem_input_verification.py tests/windows/test_ax260_265_filesystem_structural.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src/agentx/capabilities/filesystem_structural.py tests/adversarial/test_ax260_297_authority_and_verification.py tests/architecture/test_ax260_297_completion_boundaries.py tests/failure_injection/test_ax260_265_filesystem_failures.py tests/integration/test_ax260_297_governed_completion.py tests/unit/test_ax260_297_filesystem_input_verification.py tests/windows/test_ax260_265_filesystem_structural.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit repair
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name 'agentx-campaign-bot'
            git config user.email 'agentx-campaign-bot@users.noreply.github.com'
            git add src/agentx/capabilities/filesystem_structural.py tests/adversarial/test_ax260_297_authority_and_verification.py tests/architecture/test_ax260_297_completion_boundaries.py tests/failure_injection/test_ax260_265_filesystem_failures.py tests/integration/test_ax260_297_governed_completion.py tests/unit/test_ax260_297_filesystem_input_verification.py tests/windows/test_ax260_265_filesystem_structural.py
            git commit -m 'style: close AX-260-297 static gates'
            git push origin HEAD:agent/ax-260-265-296-297-filesystem-verification
          }
