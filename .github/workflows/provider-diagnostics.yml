name: Provider diagnostics (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - name: Report style and types without changing files
        shell: python
        run: |
          import subprocess, sys
          paths = ['src/agentx/cognition/http_model_provider.py', 'tests/integration/test_http_model_provider.py']
          commands = [[sys.executable, '-m', 'ruff', 'check', *paths], [sys.executable, '-m', 'ruff', 'format', '--diff', *paths], [sys.executable, '-m', 'mypy']]
          statuses = [subprocess.run(command, check=False).returncode for command in commands]
          sys.exit(max(statuses))
