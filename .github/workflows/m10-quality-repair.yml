name: Temporary M10 Quality Repair

on:
  push:
    branches:
      - agent-m10/world-model-completion

permissions:
  contents: write

jobs:
  repair-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M10 branch
        uses: actions/checkout@v7
        with:
          ref: agent-m10/world-model-completion

      - name: Apply exact M10 typing repairs
        shell: python
        run: |
          from pathlib import Path

          production = Path("src/agentx/world_model.py")
          text = production.read_text(encoding="utf-8")
          method_start = text.index("    def ingest_windows_snapshot(")
          window_start = text.index("            state = WindowState(\n", method_start)
          window_end_marker = "            window_states.append(state)\n"
          window_end = text.index(window_end_marker, window_start) + len(window_end_marker)
          window_block = text[window_start:window_end]
          window_block = window_block.replace("            state = WindowState(\n", "            window_state = WindowState(\n", 1)
          window_block = window_block.replace("            self.cache.put(state)\n", "            self.cache.put(window_state)\n", 1)
          window_block = window_block.replace("            window_states.append(state)\n", "            window_states.append(window_state)\n", 1)
          text = text[:window_start] + window_block + text[window_end:]

          process_start = text.index("            state = ProcessState(\n", method_start)
          process_end_marker = "            process_states.append(state)\n"
          process_end = text.index(process_end_marker, process_start) + len(process_end_marker)
          process_block = text[process_start:process_end]
          process_block = process_block.replace("            state = ProcessState(\n", "            process_state = ProcessState(\n", 1)
          process_block = process_block.replace("            self.cache.put(state)\n", "            self.cache.put(process_state)\n", 1)
          process_block = process_block.replace("            process_states.append(state)\n", "            process_states.append(process_state)\n", 1)
          text = text[:process_start] + process_block + text[process_end:]
          production.write_text(text, encoding="utf-8", newline="\n")

          host_test = Path("tests/integration/test_world_model_windows_host.py")
          text = host_test.read_text(encoding="utf-8")
          text = text.replace(
              "from agentx.world_model import CacheRefreshState, WorldAvailability, WorldModel",
              "from agentx.world_model import (\n    CacheRefreshState,\n    FilesystemState,\n    WorldAvailability,\n    WorldModel,\n)",
              1,
          )
          text = text.replace(
              "    assert second.value is not None\n    assert second.value.size_bytes == len(\"after\")",
              "    assert isinstance(second.value, FilesystemState)\n    assert second.value.size_bytes == len(\"after\")",
              1,
          )
          host_test.write_text(text, encoding="utf-8", newline="\n")

      - name: Install development tools
        run: python -m pip install ".[dev]"

      - name: Lint and format M10 files
        shell: bash
        run: |
          python -m ruff check --fix \
            src/agentx/world_model.py \
            tests/unit/test_world_model.py \
            tests/integration/test_world_model_integration.py \
            tests/integration/test_world_model_windows_host.py \
            tests/adversarial/test_world_model_adversarial.py \
            tests/architecture/test_world_model_boundaries.py
          python -m ruff format \
            src/agentx/world_model.py \
            tests/unit/test_world_model.py \
            tests/integration/test_world_model_integration.py \
            tests/integration/test_world_model_windows_host.py \
            tests/adversarial/test_world_model_adversarial.py \
            tests/architecture/test_world_model_boundaries.py

      - name: Commit repaired files
        shell: bash
        run: |
          if git diff --quiet -- \
            src/agentx/world_model.py \
            tests/unit/test_world_model.py \
            tests/integration/test_world_model_integration.py \
            tests/integration/test_world_model_windows_host.py \
            tests/adversarial/test_world_model_adversarial.py \
            tests/architecture/test_world_model_boundaries.py; then
            echo "No M10 typing repair changes required."
          else
            git config user.name "agentx-ci-repair"
            git config user.email "agentx-ci-repair@users.noreply.github.com"
            git add \
              src/agentx/world_model.py \
              tests/unit/test_world_model.py \
              tests/integration/test_world_model_integration.py \
              tests/integration/test_world_model_windows_host.py \
              tests/adversarial/test_world_model_adversarial.py \
              tests/architecture/test_world_model_boundaries.py
            git commit -m "Fix M10 world-model typing defects"
            git push origin HEAD:agent-m10/world-model-completion
          fi

      - name: Ruff lint preflight
        run: python -m ruff check .

      - name: Ruff format preflight
        run: python -m ruff format --check .
