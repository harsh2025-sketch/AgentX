name: Campaign Hive Line Fix

on:
  push:
    branches:
      - agent/ax-120-124-hive-knowledge

permissions:
  contents: write

jobs:
  linefix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ax-120-124-hive-knowledge
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact Ruff line fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('src/agentx/core/knowledge_assurance.py')
          text = path.read_text(encoding='utf-8')
          old = '            raise KnowledgeValidationError(f"unknown revalidation outcome: {outcome_raw!r}") from exc\n'
          new = '            raise KnowledgeValidationError(\n                f"unknown revalidation outcome: {outcome_raw!r}"\n            ) from exc\n'
          if old not in text:
              raise SystemExit('expected line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          python -m pip install 'ruff==0.16.7'
          python -m ruff check src/agentx/core/knowledge_assurance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format src/agentx/core/knowledge_assurance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit repair
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name 'agentx-campaign-bot'
            git config user.email 'agentx-campaign-bot@users.noreply.github.com'
            git add src/agentx/core/knowledge_assurance.py
            git commit -m 'style: close AX-122 assurance lint gate'
            git push origin HEAD:agent/ax-120-124-hive-knowledge
          }
