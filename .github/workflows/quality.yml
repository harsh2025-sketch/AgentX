name: C1.01 Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate runtime-only installation
        shell: pwsh
        run: |
          python -m venv .runtime-venv
          $runtimePython = (Resolve-Path ".runtime-venv\Scripts\python.exe").Path
          & $runtimePython -m pip install .
          Push-Location $env:TEMP
          try {
            & $runtimePython -I -c "import agentx; from importlib.metadata import version; assert version('agentx') == agentx.__version__"
            & $runtimePython -I -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pytest', 'ruff', 'mypy'))"
            & $runtimePython -I -m agentx --version
          }
          finally {
            Pop-Location
          }

      - name: Build M16 release wheel and evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, artifacts | Out-Null
          python -m pip wheel . --no-deps --wheel-dir dist
          $wheel = Get-ChildItem dist -Filter "agentx-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "AgentX wheel was not built" }
          $hash = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            artifact = $wheel.Name
            sha256 = $hash
            bytes = $wheel.Length
            python = (python --version)
          } | ConvertTo-Json | Set-Content artifacts/release-artifact.json
          "AGENTX_WHEEL=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fresh wheel install acceptance
        shell: pwsh
        run: |
          python -m venv .fresh-venv
          $freshPython = (Resolve-Path ".fresh-venv\Scripts\python.exe").Path
          & $freshPython -m pip install $env:AGENTX_WHEEL
          $freshData = Join-Path $env:RUNNER_TEMP "agentx-m16-fresh"
          Remove-Item -Recurse -Force $freshData -ErrorAction SilentlyContinue
          & $freshPython -I -m agentx init --data-dir $freshData
          & $freshPython -I -m agentx doctor --data-dir $freshData
          & $freshPython -I -m agentx --version

      - name: Prior-main package upgrade acceptance
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $baselineSha = "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach .m16-baseline $baselineSha
          New-Item -ItemType Directory -Force baseline-dist | Out-Null
          python -m pip wheel .m16-baseline --no-deps --wheel-dir baseline-dist
          $baselineWheel = (Get-ChildItem baseline-dist -Filter "agentx-*.whl" | Select-Object -First 1).FullName
          python -m venv .upgrade-venv
          $upgradePython = (Resolve-Path ".upgrade-venv\Scripts\python.exe").Path
          & $upgradePython -m pip install $baselineWheel
          $upgradeData = Join-Path $env:RUNNER_TEMP "agentx-m16-upgrade"
          Remove-Item -Recurse -Force $upgradeData -ErrorAction SilentlyContinue
          & $upgradePython -I -c "from pathlib import Path; from agentx.infrastructure.persistence import SQLiteDatabase; p=Path(r'$upgradeData')/'agentx.sqlite3'; cm=SQLiteDatabase(p).connection(); c=cm.__enter__(); c.execute('CREATE TABLE IF NOT EXISTS m16_upgrade_sentinel(value TEXT NOT NULL)'); c.execute('INSERT INTO m16_upgrade_sentinel(value) VALUES (?)', ('preserved',)); cm.__exit__(None,None,None)"
          & $upgradePython -m pip install --upgrade --force-reinstall $env:AGENTX_WHEEL
          & $upgradePython -I -m agentx doctor --data-dir $upgradeData
          & $upgradePython -I -c "import sqlite3; from pathlib import Path; p=Path(r'$upgradeData')/'agentx.sqlite3'; c=sqlite3.connect(p); assert c.execute('SELECT value FROM m16_upgrade_sentinel').fetchone()[0] == 'preserved'; c.close()"
          git worktree remove --force .m16-baseline

      - name: Capture M16 environment and benchmark evidence
        run: |
          python scripts/m16_environment_matrix.py --output artifacts/environment-matrix.json
          python scripts/m16_benchmark.py --repetitions 5 --output artifacts/benchmark.json

      - name: Install development tools
        run: python -m pip install ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run Ruff format check
        run: |
          python -m ruff format --diff .
          python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy

      - name: Validate task ledger and M16 corpus
        run: |
          python scripts/task_ledger.py
          python scripts/m16_corpus.py

      - name: Run Windows host acceptance
        env:
          AGENTX_M6_REAL_HOST: "1"
        run: python -m pytest -q -s tests/windows/test_m6_real_host_acceptance.py tests/windows/test_m6_multi_app_workflow.py tests/windows/test_m10_screen_capture_real_host.py

      - name: Run M7 real browser acceptance
        env:
          AGENTX_M7_REAL_BROWSER: "1"
        run: python -m pytest -q -s tests/windows/test_m7_real_browser_acceptance.py

      - name: Run M16 security and acceptance corpus
        run: python scripts/m16_corpus.py --run

      - name: Run pytest
        run: python -m pytest

      - name: Upload M16 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentx-m16-release-evidence
          path: |
            dist/*.whl
            artifacts/*.json
          if-no-files-found: error
