name: M10 final acceptance repair v2

on:
  push:
    branches:
      - agent-m10/world-model-completion
    paths:
      - .github/workflows/m10-finalize-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-m10/world-model-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply final M10 patch and narrow test types
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          workflow = Path('.github/workflows/m10-finalize.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          script: list[str] = []
          inside = False
          for line in lines:
              if line.strip() == "@'":
                  inside = True
                  continue
              if inside and line.strip().startswith("'@ | Set-Content"):
                  break
              if inside:
                  script.append(line[10:] if line.startswith('          ') else line)
          if not script:
              raise RuntimeError('could not extract original M10 patch script')
          Path('m10_finalize_patch.py').write_text('\n'.join(script) + '\n', encoding='utf-8')
          '@ | Set-Content -Path extract_patch.py -Encoding UTF8
          python extract_patch.py
          python m10_finalize_patch.py
          Remove-Item extract_patch.py,m10_finalize_patch.py

          @'
          from pathlib import Path

          path = Path('tests/unit/test_world_model.py')
          text = path.read_text(encoding='utf-8')
          if '    WindowState,\n' not in text:
              marker = '    WindowShowState,\n'
              if marker not in text:
                  raise RuntimeError('WindowShowState import marker missing')
              text = text.replace(marker, marker + '    WindowState,\n', 1)
          old = '''    assert active.value is not None\n    assert active.value.is_foreground is True\n'''
          new = '''    assert isinstance(active.value, WindowState)\n    assert active.value.is_foreground is True\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('foreground narrowing assertion block missing')
          old = '''    assert binder.get(task_a) is not None\n    assert binder.get(task_b) is not None\n    assert binder.get(task_a).task_id == task_a\n    assert binder.get(task_b).task_id == task_b\n'''
          new = '''    binding_a = binder.get(task_a)\n    binding_b = binder.get(task_b)\n    assert binding_a is not None\n    assert binding_b is not None\n    assert binding_a.task_id == task_a\n    assert binding_b.task_id == task_b\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('binder narrowing assertion block missing')
          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -Path narrow_tests.py -Encoding UTF8
          python narrow_tests.py
          Remove-Item narrow_tests.py

      - name: Install development tools
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Ruff auto-fix and format touched Python
        shell: pwsh
        run: |
          python -m ruff check --fix src/agentx/world_model.py src/agentx/capabilities/windows/_native.py src/agentx/capabilities/windows/process_discovery.py tests/support/fake_windows_native.py tests/unit/test_world_model.py tests/integration/test_world_model_integration.py tests/integration/test_world_model_windows_host.py tests/architecture/test_windows_provider_boundaries.py tests/architecture/test_windows_process_discovery_boundaries.py
          python -m ruff format src/agentx/world_model.py src/agentx/capabilities/windows/_native.py src/agentx/capabilities/windows/process_discovery.py tests/support/fake_windows_native.py tests/unit/test_world_model.py tests/integration/test_world_model_integration.py tests/integration/test_world_model_windows_host.py tests/architecture/test_windows_provider_boundaries.py tests/architecture/test_windows_process_discovery_boundaries.py

      - name: Focused M10 acceptance tests
        shell: pwsh
        run: |
          python -m pytest tests/unit/test_world_model.py tests/integration/test_world_model_integration.py tests/integration/test_world_model_windows_host.py tests/architecture/test_world_model_boundaries.py tests/architecture/test_windows_provider_boundaries.py tests/architecture/test_windows_process_discovery_boundaries.py tests/adversarial/test_world_model_adversarial.py -q

      - name: Static gates
        shell: pwsh
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Commit repaired M10 package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agentx/world_model.py src/agentx/capabilities/windows/_native.py src/agentx/capabilities/windows/process_discovery.py tests/support/fake_windows_native.py tests/unit/test_world_model.py tests/integration/test_world_model_integration.py tests/integration/test_world_model_windows_host.py tests/architecture/test_windows_provider_boundaries.py tests/architecture/test_windows_process_discovery_boundaries.py docs/architecture/world_model.md
          git diff --cached --check
          git commit -m "fix: close remaining M10 acceptance gaps"
          git push origin HEAD:agent-m10/world-model-completion
